workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.swaziapplilab.noq
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build iOS App
        script: |
          cd ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa

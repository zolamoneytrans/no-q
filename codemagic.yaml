workflows:
  ios-app-store:
    name: Build and publish iOS app to App Store Connect
    integrations:
      app_store_connect: app_store2
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - app_store2
      vars:
        APPLE_TEAM_ID: "44Z38W9GRD"
    scripts:
      - name: Set dynamic build number and version for App Store Connect
        script: |
          set -e
          cd ios
          # Ensure CFBundleVersion is dynamically incremented beyond build number 3 (e.g. $BUILD_NUMBER + 3)
          TARGET_BUILD_NUMBER=$(($BUILD_NUMBER + 3))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TARGET_BUILD_NUMBER" CarWash/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" CarWash/Info.plist
          echo "Dynamically set CFBundleVersion to $TARGET_BUILD_NUMBER and CFBundleShortVersionString to 1.0"
      - name: Fetch signing files and set up keychain
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "africa.carwashes.noq" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/CarWash.xcodeproj --export-options-plist ios/exportOptions.plist
      - name: Build iOS app archive
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild -project ios/CarWash.xcodeproj \
            -scheme CarWash \
            -configuration Release \
            -sdk iphoneos \
            archive \
            -archivePath "$CM_BUILD_DIR/build/CarWash.xcarchive"
      - name: Export App Store package
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/build/ios"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/CarWash.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios" \
            -exportOptionsPlist ios/exportOptions.plist
    artifacts:
      - build/ios/*.ipa
      - build/ios/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
